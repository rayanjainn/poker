services:
  db:
    image: postgres:latest
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=poker
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    restart: always
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/poker
      - PORT=8080
      - JWT_SECRET=super-secret-key-change-this
    ports:
      - "8080:8080"
    depends_on:
      - db

  frontend:
    build: ./frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_WS_URL=ws://localhost:8080/ws
    ports:
      - "3000:3000"
